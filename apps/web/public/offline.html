<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2c2c34" media="(prefers-color-scheme: dark)" />
    <title>The Chat</title>
    <!--
      The service worker serves this when a page cannot reach the server. It
      stands alone, without the app's stylesheet, so the palette is copied
      here: paper, ink and the accent, as in packages/ui globals.css.
    -->
    <style>
      :root {
        color-scheme: light;
        --paper: #ffffff;
        --ink: #1c1c1e;
        --ink-secondary: #6e6e73;
      }
      :root.dark {
        color-scheme: dark;
        --paper: #2c2c34;
        --ink: #f3f3f5;
        --ink-secondary: #c6c6ce;
      }
      body {
        margin: 0;
        font-family:
          "Geist Variable",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Noto Sans SC",
          sans-serif;
        background: var(--paper);
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        height: 100svh;
        padding: 0 32px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      p {
        margin: 8px 0 0;
        max-width: 280px;
        font-size: 15px;
        line-height: 24px;
        color: var(--ink-secondary);
      }
      button {
        margin-top: 24px;
        height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 9999px;
        background: #1a73e8;
        color: #ffffff;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
    <script>
      // The reader's theme and language, as the app keeps them.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("the-chat-preferences") || "{}");
          var t = p.theme === "light" || p.theme === "dark" ? p.theme : null;
          var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", d);
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = d ? "#2c2c34" : "#ffffff";
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <main>
      <h1 id="title">You’re offline</h1>
      <p id="detail">This screen updates on its own when you’re back online.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      (function () {
        // The saved choice, then the first supported language the browser asks for.
        var tags = [(/(?:^|;\s*)lang=([^;]*)/.exec(document.cookie) || [])[1]].concat(
          navigator.languages || [navigator.language],
        );
        var locale = tags
          .map(function (tag) {
            return String(tag || "")
              .toLowerCase()
              .split(/[-_]/)[0];
          })
          .find(function (base) {
            return base === "en" || base === "zh";
          });
        if (locale === "zh") {
          document.documentElement.lang = "zh-CN";
          document.getElementById("title").textContent = "网络未连接";
          document.getElementById("detail").textContent = "联网后，这个页面会自动更新。";
          document.getElementById("retry").textContent = "重试";
        }
        // The address is still the page that was asked for, so a reload is the retry.
        document.getElementById("retry").addEventListener("click", function () {
          location.reload();
        });
        addEventListener("online", function () {
          location.reload();
        });
      })();
    </script>
  </body>
</html>
