name: my-better-t-app

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      DATABASE_URL: file:/data/local.db
    volumes:
      - type: bind
        source: ./.data
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
