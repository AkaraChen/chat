name: my-better-t-app

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      DATABASE_URL: file:/data/local.db
      CREDENTIALS_DIR: /data/credentials
      GITHUB_TOKEN_FILE: /data/github.json
      MODELS_DEV_CACHE_FILE: /data/models-dev.json
      # The web server runs the model proxy. It listens on all interfaces so
      # the worker container can reach it.
      PROXY_DATA_DIR: /data/proxy
      PROXY_HOST: 0.0.0.0
      PROXY_URL: http://127.0.0.1:8317
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    volumes:
      - type: bind
        source: ./.data
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Titles threads, and syncs connection models from models.dev twice a day.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    init: true
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      DATABASE_URL: file:/data/local.db
      CREDENTIALS_DIR: /data/credentials
      MODELS_DEV_CACHE_FILE: /data/models-dev.json
      PROXY_URL: http://web:8317
      REDIS_URL: redis://redis:6379
    volumes:
      - type: bind
        source: ./.data
        target: /data
        bind:
          create_host_path: false
    depends_on:
      - web
      - redis
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
